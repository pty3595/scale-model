# 새 클러스터의 값. 복사해서 clusters/<이름>.toml 로 두고 채운다.
#   1. [access] 와 threefs.admin_cli · admin_host 를 채운다
#   2. SM_CLUSTER=<이름> python3 cluster.py discover <이름> — admin_cli 와 각 노드에서 찾은 값으로 초안을 다시 낸다
#   3. 초안의 빈칸과 "# 확인" 을 사람이 채우고 고친다. [allow] 는 클러스터 주인에게 묻는다
#   4. python3 cluster.py check 가 "통과" 를 낼 때까지
# 이 장비의 hostname 이 [[client]] 에 있어야 도구가 이 파일을 고른다. 비밀번호는 여기 적지 않는다(파일 경로만).
name = ""

[access]
ssh_user = ""                 # 다른 노드에 ssh 할 계정. sudo 가 되는 계정이다(admin_cli · FUSE 로그 · storage 설정 읽기)
ssh_password_file = ""        # 비밀번호 한 줄이 든 파일(권한 600, 저장소 밖). 비우면 키로 접속한다
sudo_password_file = ""       # 비우면 sudo -n(NOPASSWD)
# runs_as = ""                # (선택) 원격에서 replay · 표본을 돌릴 계정이 ssh_user 와 다르면. ssh_user 가 비밀번호 없이
                              # sudo -n -u <runs_as> 로 될 수 있어야 하고(그래서 sudo_password_file 은 비운다), 그 계정의 login 환경 · $HOME 으로 돈다.
                              # root 명령(admin_cli · FUSE 로그 · storage 설정)은 ssh_user 의 sudo 로 돈다

[threefs]
mount = ""                    # 3FS FUSE 마운트(/proc/mounts 의 fuse.hf3fs)
data_root = ""                # 마운트 아래 우리만 쓰는 폴더. 재생 데이터를 여기에 쓰고 지운다
admin_cli = ""                # 예: /opt/3fs/bin/admin_cli -cfg /opt/3fs/etc/admin_cli.toml
admin_host = ""               # admin_cli 를 돌릴 노드(ssh_user 로 접속해 sudo 한다). 이 장비면 localhost
fuse_log = ""                 # FUSE 가 설정을 찍는 로그 — 설정이 실제로 걸렸는지 여기서 본다
fuse_service = ""             # FUSE systemd 서비스(fuse_restart 를 허락할 때만 쓴다)
fuse_template = ""            # 지금 mgmtd 의 FUSE 템플릿 사본(discover 가 받아 둔다). 실험이 끝나면 이것으로 되돌린다

# 바꿔도 되는 것. 클러스터 주인에게 묻고 채운다. false 면 그 설정 후보는 건너뛰고 지금 값만 기록한다
[allow]
fuse_template = false         # admin_cli set-config --type FUSE (클라이언트 읽기 · 연결 설정, 되돌린다)
storage_hot_update = false    # admin_cli hot-update-config -t STORAGE (request-to-send · RDMA 동시 수 · coroutine, 되돌린다)
fuse_restart = false          # FUSE 다시 띄우기(쓰기 admission · 쓰기 묶음). 사람이 있을 때만
throttle = false              # throttle.sh(PoC 에서 비율을 맞추던 것). 보통 필요 없다

# 되돌릴 storage hot-update 값 — discover 가 지금 값을 읽어 채운다
[home]
rts = ""                      # request-to-send(storage rdma_transmission_req_timeout 이 0 이 아니면 on)
coro = ""                     # server.coroutines_pool_update coroutines/threads
coro_read = ""                # server.coroutines_pool_read
st_rdma = ""                  # server.storage max_concurrent_rdma_writes/reads

# 실험 기준. 후보는 여기서 하나씩 바꾼다. 처음은 3FS 소스 기본값으로 둔다(보고의 출발점 baseline 과 같다).
# 쓰기 둘(admission · 묶음)은 FUSE 를 다시 띄워야 바뀌어 여기 두지 않는다 — 지금 걸린 값(템플릿 값, 다시 띄웠으면 FUSE_WRITE · FUSE_WBATCH)으로 돈다
[ref]
read = "32/8"                 # 읽기 admission max_concurrent_requests / _per_server
batch = "4MB"                 # 읽기 max_batch_bytes
rdma = "false"                # FUSE enable_rdma_control (request-to-send 의 클라이언트 쪽)
conn = "1"                    # transport_pool max_connections
mct = "64"                    # rdma_control max_concurrent_transmission
rts = "off"
coro = "64/8"
tsel = "Default"              # storage_io.read.targetSelection mode

# 클라이언트(replay 를 돌릴 노드) 하나마다. storage 노드가 클라이언트도 맡으면 같은 host 를 [[storage]] 에도 둔다
[[client]]
host = ""                     # hostname 그대로
addr = ""                     # 이 장비에서 ssh 할 주소
python = ""                   # LMCache 가 든 venv 의 python
workdir = ""                  # 이 도구 사본(driver.py 를 여기에 덮어쓴다)
netdevs = []                  # 3FS 가 쓰는 RDMA NIC(여럿이면 모두). 사용률 카운터를 여기서 읽는다

[[storage]]
host = ""
addr = ""
node_id = ""                  # admin_cli list-nodes 의 STORAGE Id
netdevs = []
nvme = []                     # 3FS target 이 든 NVMe 장치

# 3FS 구성과 (선택) 천장. 천장은 결과를 사용률(%)로 적을 때만 쓴다 — sweep 은 replay 배속으로 돈다.
# 3FS 경로 천장(모든 클라이언트의 fio-usrbio 합)은 여기에 적지 않고 ceiling.py 가 재서 clusters/<이름>-ceiling.json 에 둔다
[measured]
# disk_read_gibps = ""        # (선택) storage NVMe 전체 동시 읽기 합. 사양값이면 그렇게 적어 둔다
# disk_write_gibps = ""
# link_gibps = ""             # (선택) 노드 하나의 RDMA 선로 합(GiB/s). 100 GbE 하나면 11.64
replicas = ""                 # chain 마다 target 수(list-chains)
chains = ""
default_stripe = ""           # stat --display-layout / — 재생 폴더의 기본 layout 이다
chunk_bytes = ""
# client_load_wall_gibps = ""   # (선택) 클라이언트 한 대 load · store 한계. plan.py 가 넘는 배속을 빼고 "max" 를 정한다. 없으면 자르지 않는다
# client_store_wall_gibps = ""

# (선택) 대당 미리 쓰기 속도 어림(GiB/s) — replay 의 출발 시각. 없으면 PoC 값(dram 0.35 · dram_zc 1.2 · hf3fs 1.5).
# 느리게 잡으면 출발만 늦고, 빠르게 잡으면 미리 쓰기가 덜 끝나 그 실행이 무효다
# [prepop_gibps]
# hf3fs = 1.5

# (선택) 빌드 경로. NIXL dram_zc 의 2 GiB 버그 shim(LD_PRELOAD) — 그 knob 을 쓸 때만, 클라이언트마다 같은 경로
# fio-usrbio · 엔진 · libhf3fs_api(ceiling.py) — 클라이언트마다 같은 경로. 아래는 기본값
# [builds]
# pwrite_shim = "/tmp/pwrite_full.so"
# fio_usrbio = "/opt/3fs/bin/fio-usrbio"
# usrbio_engine = "/opt/3fs/lib/fio/hf3fs_usrbio.so"
# hf3fs_lib = "/opt/3fs/lib"
